<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Podcast Player</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="player-card">
        <div class="cover-container">
            <img src="../picture/jpg.jpg" alt="Podcast Cover" class="cover">
        </div>
        <div class="info-container">
            <div class="title">Очень долгий подкаст о том как я не хочу на Дмитренко</div>
            
            <div class="controls">
                <button class="control-btn">
                    <i class="fas fa-step-backward"></i>
                </button>
                <button class="control-btn play-pause">
                    <i class="fas fa-pause"></i>
                </button>
                <button class="control-btn">
                    <i class="fas fa-step-forward"></i>
                </button>
            </div>
            
            <!-- Прогресс прослушивания -->
            <input type="range" class="progress-bar" value="0" max="100" step="1">
            <div class="progress-time">
                <span class="current-time">00:00</span> / <span class="duration">00:00</span>
            </div>
        </div>
        <button class="add-to-wishlist">
            <i class="far fa-heart"></i>
        </button>
    </div>
    <script src="script.js"></script>
</body>
</html>
