<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Добавить подкаст</title>
    <!-- Подключение шрифта -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat+Alternates:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <!-- Подключение CSS -->
    <link rel="stylesheet" href="../css/add_podcast.css">
</head>
<body>
    <form action="../php/add_podcast.php" method="POST" enctype="multipart/form-data">
        <div class="card">

            <div class="form-group">
                <label for="author">Автор подкаста (Внимание, слушатели будут видеть это имя во время прослушивания подкаста):</label>
                <input type="text" id="author" name="author" required>
            </div>

            <div class="form-group">
                <label for="title">Название подкаста:</label>
                <input type="text" id="title" name="title" required>
            </div>
    
            <div class="form-group">
                <label for="description">Описание:</label>
                <textarea id="description" name="description" rows="4" required></textarea>
            </div>
    
            <div class="form-group">
                <label for="audio">Аудиофайл:</label>
                <input type="file" id="audio" name="audio" accept="audio/*" required>
            </div>
            <div class="form-group">
                <label for="image">Изображение:</label>
                <input type="file" id="image" name="image" accept="image/*" required>
            </div>

            <div class="form-group">
                <label for="genres">Выберите темы:</label>
                <select id="genres" name="genres[]" multiple required>
                    <!-- Жанры будут загружены динамически -->
                </select>
            </div>
            
            <script>
                document.addEventListener("DOMContentLoaded", function() {
                    fetch('/php/get_genres.php')
                        .then(response => response.json())
                        .then(data => {
                            const select = document.getElementById('genres');
                            data.forEach(genre => {
                                const option = document.createElement('option');
                                option.value = genre.id;
                                option.textContent = genre.name;
                                select.appendChild(option);
                            });
                        })
                        .catch(error => console.error('Ошибка загрузки жанров:', error));
                });
            </script>
            
    
            <button type="submit">Добавить подкаст</button>
        </div>
    </form>
</body>
</html>
