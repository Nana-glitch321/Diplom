    <script>
        // Добавим обработчик кликов на элементы выбора скорости
        document.querySelectorAll('.speed-option').forEach(function(option) {
            option.addEventListener('click', function() {
                const speed = parseFloat(option.getAttribute('data-speed'));
                document.getElementById('audio-player').playbackRate = speed;
                document.getElementById('speed-value').innerText = speed + 'x';
                document.querySelector('.speed-menu').style.display = 'none'; // скрываем меню
            });
        });

        // Обработчик для кнопки скорости (открывает меню)
        document.getElementById('speed-control').addEventListener('click', function() {
            const menu = document.querySelector('.speed-menu');
            menu.style.display = (menu.style.display === 'block') ? 'none' : 'block';
        });
    </script>
