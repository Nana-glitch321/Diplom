<div class="player-container">
    <div class="cover-container">
        <img src="assets/podcast-cover.jpg" alt="Podcast Cover" class="cover" id="podcast-cover">
    </div>
    <div class="info-container">
        <div class="author" id="author">Автор подкаста</div>
        <div class="title" id="podcast-title">Название подкаста</div>
        
        <div class="controls">
            <button class="control-btn" id="prev">
                <i class="fas fa-step-backward"></i>
            </button>
            <button class="control-btn play-pause" id="playPause">
                <i class="fas fa-play"></i>
            </button>
            <button class="control-btn" id="next">
                <i class="fas fa-step-forward"></i>
            </button>
            <button class="control-btn" id="speed-control">
                <i class="fas fa-tachometer-alt"></i> <span id="speed-value">1x</span>
            </button>
        </div>
        <div class="player-container">
            <div class="cover-container">
                <img src="assets/podcast-cover.jpg" alt="Podcast Cover" class="cover" id="podcast-cover">
            </div>
            <div class="info-container">
                <div class="author" id="author">Автор подкаста</div>
                <div class="title" id="podcast-title">Название подкаста</div>
                
                <div class="controls">
                    <button class="control-btn" id="prev">
                        <i class="fas fa-step-backward"></i>
                    </button>
                    <button class="control-btn play-pause" id="playPause">
                        <i class="fas fa-play"></i>
                    </button>
                    <button class="control-btn" id="next">
                        <i class="fas fa-step-forward"></i>
                    </button>

                        <i class="fas fa-tachometer-alt"></i> <span id="speed-value">1x</span>
                    </button>
                </div>
        
                <audio id="audio-player" preload="metadata"></audio>
                <input type="range" class="progress-bar" id="progress-bar" value="0" max="100" step="1">
                <div class="progress-time">
                    <span class="current-time" id="current-time">00:00</span> / 
                    <span class="duration" id="duration">00:00</span>
                </div>
            </div>
        </div>
